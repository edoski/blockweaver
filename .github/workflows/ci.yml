name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --dev --python 3.11
      - run: uv run --python 3.11 pytest
      - run: uv run --python 3.11 --extra bigquery python -c "from google.cloud import bigquery"
      - run: uv run --python 3.11 ruff check src tests
      - run: uv run --python 3.11 ruff format --check src tests
      - run: uv run --python 3.11 pyright
      - run: uv run --python 3.11 vulture src tests --min-confidence 80
