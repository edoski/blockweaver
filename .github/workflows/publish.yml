name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/blockweaver
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync --locked --dev --python 3.11
      - name: Check release tag
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv run --python 3.11 pytest
      - run: uv run --python 3.11 --extra bigquery python -c "from google.cloud import bigquery"
      - run: uv run --python 3.11 ruff check src tests
      - run: uv run --python 3.11 ruff format --check src tests
      - run: uv run --python 3.11 pyright
      - run: uv run --python 3.11 vulture src tests --min-confidence 80
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
