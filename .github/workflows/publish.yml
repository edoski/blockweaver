name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv python install 3.11
      - run: uv sync --locked --dev --python 3.11
      - name: Check release commit
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check release tag
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv run --python 3.11 pytest
      - run: uv run --python 3.11 --extra bigquery python -c "from google.cloud import bigquery"
      - run: uv run --python 3.11 ruff check src tests
      - run: uv run --python 3.11 ruff format --check src tests
      - run: uv run --python 3.11 pyright
      - run: uv run --python 3.11 vulture src tests --min-confidence 80
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/blockweaver
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
